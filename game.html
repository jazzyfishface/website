<h1>Catch the Fish</h1>
<p>score: <span id="score">0</span></p>
<button id="fish">🐟</button>

<script>
    let score = 0;
    function catchFish() {
        score = score + 1;
        moveFish();
        document.getElementById("score").textContent = score;
    }
    document.getElementById("fish").onclick = catchFish;
    function moveFish() {
    let fish = document.getElementById("fish");
    fish.style.left = Math.random() * 80 + "%";
    fish.style.top = Math.random() * 80 + "%";
    setInterval(moveFish, 1000);
}
</script>
